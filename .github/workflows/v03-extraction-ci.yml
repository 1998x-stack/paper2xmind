name: V0.3 Grounded Claim Extraction
on:
  push:
    branches: [feat/v0.3-pr034-grounded-claims]
  pull_request:

jobs:
  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip check
      - name: Static compile and published Schema
        run: |
          python -m compileall -q paper2xmind/extraction
          python -m paper2xmind.domain.export_schema /tmp/p2x-v034-schema
          python -m paper2xmind.extraction.export_schema /tmp/p2x-v034-claims
          test -f /tmp/p2x-v034-claims/claim_extraction_ledger_v1.schema.json
      - name: Full core and extraction golden tests
        run: python -m pytest tests -q
      - name: Backend regression tests
        env:
          P2X_DISABLE_WORKER: '1'
          DATA_DIR: /tmp/p2x-v034
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
      - name: Offline extraction CLI entry
        run: python -m paper2xmind.extraction --help

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

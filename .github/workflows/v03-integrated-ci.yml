name: V0.3 Integrated Evidence Workbench
on:
  push:
    branches: [feat/v0.3-pr036-039-evidence-workbench]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip check
      - name: Full core tests including parser, chunker and review
        run: python -m pytest tests -q
      - name: Backend authenticated API and revision integration
        env:
          P2X_DISABLE_WORKER: '1'
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
      - name: Static compile and schema contract export
        run: |
          python -m compileall -q paper2xmind backend/app
          python -m paper2xmind.domain.export_schema /tmp/v03-contracts
          python -m paper2xmind.extraction.export_schema /tmp/v03-extraction
          python -m paper2xmind.review.export_schema /tmp/v03-review
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test runner
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Chromium evidence inspector E2E
        working-directory: frontend
        run: npx playwright test

name: V0.3 Structured PDF Parser
on:
  push:
    branches: [feat/v0.3-pr031-structured-pdf-blocks]
  pull_request:
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip check
      - name: Compile new domain/parser modules
        run: python -m compileall -q paper2xmind/domain paper2xmind/parsers
      - name: Root regression including golden parser tests
        run: python -m pytest tests -q
      - name: Backend regression without external LLM
        env:
          P2X_DISABLE_WORKER: '1'
          DATA_DIR: /tmp/p2x-v031
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
      - name: Parser CLI smoke test
        run: |
          python -m paper2xmind.domain.export_schema /tmp/v03schema
          python -m paper2xmind.parsers --help
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

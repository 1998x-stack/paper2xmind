name: V0.3 Parser Routing
on:
  push:
    branches: [feat/v0.3-pr032-parser-router]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight core and backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip check
      - name: Compile and export schemas
        run: |
          python -m compileall -q paper2xmind/domain paper2xmind/parsers
          python -m paper2xmind.domain.export_schema /tmp/p2x-v032-schema
      - name: Run full core suite and router golden fixtures
        run: python -m pytest tests -q
      - name: Run V0.2 backend regression
        env:
          P2X_DISABLE_WORKER: '1'
          DATA_DIR: /tmp/p2x-v032
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
      - name: Verify offline router CLI
        run: python -m paper2xmind.parsers.router_cli --help
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

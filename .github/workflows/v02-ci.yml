name: V0.2 CI
on:
  push:
    branches: [main, feat/v0.2-pipeline-reliability]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
      - name: Core tests
        run: python -m pytest tests -q
      - name: Backend tests
        env:
          P2X_DISABLE_WORKER: '1'
          DATA_DIR: /tmp/paper2xmind-ci
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

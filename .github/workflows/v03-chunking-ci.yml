name: V0.3 Source-aware Chunker
on:
  push:
    branches: [feat/v0.3-pr033-source-aware-chunking]
  pull_request:
jobs:
  chunking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip check
      - name: Compile and export schemas
        run: |
          python -m compileall -q paper2xmind/chunking
          python -m paper2xmind.domain.export_schema /tmp/v03-schema
      - name: Core and chunk goldens
        run: python -m pytest tests -q
      - name: Backend regressions
        env:
          P2X_DISABLE_WORKER: '1'
          DATA_DIR: /tmp/p2x-v033
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
      - name: CLI smoke
        run: python -m paper2xmind.chunking --help
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

name: V0.4 Public Demo and Research Map Foundation
on:
  push:
    branches: [feat/v0.4-ph00-02-product-foundation]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application and test packages
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip check
      - name: Validate pure domain models and all core regressions
        run: python -m pytest tests -q
      - name: Legacy API, provenance, security and public PDF integration
        env:
          P2X_DISABLE_WORKER: '1'
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
      - name: Compile new modules
        run: python -m compileall -q paper2xmind/research_map backend/app/security backend/app/services/demo_catalog.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Chromium and Playwright
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser regressions for demo and private workbench
        working-directory: frontend
        run: npx playwright test

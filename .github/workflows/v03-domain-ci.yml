name: V0.3 Domain Contracts
on:
  push:
    branches: [feat/v0.3-pr030-domain-contract]
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip check
      - name: Compile domain models
        run: python -m compileall -q paper2xmind/domain
      - name: Export JSON Schema
        run: |
          python -m paper2xmind.domain.export_schema /tmp/p2x-v03-schemas
          test -f /tmp/p2x-v03-schemas/document_ir_v1.schema.json
      - name: Run full core regression
        run: python -m pytest tests -q
      - name: Run backend regression
        env:
          P2X_DISABLE_WORKER: '1'
          DATA_DIR: /tmp/paper2xmind-v03
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

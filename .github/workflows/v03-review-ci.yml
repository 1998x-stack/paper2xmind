name: V0.3 Evidence Verification
on:
  push:
    branches: [feat/v0.3-pr035-evidence-verification]
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install -e './backend[dev]'
          pip check
      - name: Static compile and base schemas
        run: |
          python -m compileall -q paper2xmind/review
          python -m paper2xmind.domain.export_schema /tmp/p2x-v035-domains
          python -m paper2xmind.extraction.export_schema /tmp/p2x-v035-extraction
          python -m paper2xmind.review.export_schema /tmp/p2x-v035-review
          test -f /tmp/p2x-v035-review/review_outcome_v1.schema.json
          python -m paper2xmind.review --help
      - name: Core and PR-035 adversarial golden tests
        run: python -m pytest tests -q
      - name: Backend regressions
        env:
          P2X_DISABLE_WORKER: '1'
          DATA_DIR: /tmp/p2x-v035
        run: PYTHONPATH=.:backend python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
